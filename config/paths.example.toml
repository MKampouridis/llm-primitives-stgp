# Machine-specific paths. Copy to config/paths.toml (git-ignored) and edit,
# or point the LPSTGP_PATHS environment variable at another file (e.g. on a cluster).
# A leading "~" is expanded; relative paths are relative to the repository root.
# Working paths must not be inside a cloud-synced folder (Box, Dropbox, iCloud, OneDrive).

data_dir = "data"         # raw + processed market data (tierA, tierB, tierC); git-ignored
results_dir = "results"   # per-run summaries and best individuals; git-ignored
reports_dir = "reports"   # generated reports, one subfolder per work package; tracked in git
cache_dir = "cache"       # disposable, size-capped caches; git-ignored

# Optional one-way backup mirror, written only by scripts/backup.py (may be cloud-synced).
# backup_dir = "~/Library/CloudStorage/Box-Box/.../llm-primitives-stgp"

# Optional hand-over folder between two Macs, used only by scripts/handover.py (D-055); cloud-synced.
# handover_dir = "~/Library/CloudStorage/Box-Box/.../llm-primitives-stgp-handover"
