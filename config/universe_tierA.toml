# Tier A pilot universe: cross-asset instruments from free sources (pilot only; see docs/decisions.md).
#
# primary     the series used by default (source + symbol; `divide_by` builds a ratio of two series)
# alternates  other series for the same exposure, downloaded for comparison in the data report
# calendar    "business" (exchange or fixing days) or "7day" (crypto)
# qa_calendar exchange_calendars code used for expected sessions in the data report ("" = weekdays)
# cost_bps    base one-way transaction cost in basis points (broker-spread model v1, provisional)

