[project]
name = "lpstgp"
version = "0.1.0"
description = "Typed mathematical primitives and a strongly typed GP harness for trading rules (research code)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0,<2.6",
    "scipy>=1.13",
    "numba>=0.68",
    "pandas>=2.2",
    "pyarrow>=17",
    "deap==1.4.4",
    "requests>=2.32",
    "exchange-calendars>=4.13",
    "xlrd>=2.0",
]

[project.optional-dependencies]
# Pilot-only market-data download (Tier A); never needed by tests or CI.
download = ["yfinance>=1.7"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-xdist>=3.6",
    "hypothesis>=6.120",
    "ruff>=0.14",
]
# Test-only reference implementations used to validate operators.
reference = [
    "pot>=0.9.7",
    "antropy>=0.2.3",
    "ordpy>=1.2.3",
    "nolds>=0.6.3",
    "kramersmoyal>=0.4.1",
    "pywavelets>=1.10",
    "scikit-learn>=1.5",
    "statsmodels>=0.15",
    "ta>=0.11",
    "roughpy==0.3.0",
]

[tool.uv]
default-groups = ["dev", "reference"]
# Use uv-managed CPython only (same interpreter builds locally and in CI; never Anaconda/system).
python-preference = "only-managed"

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "RUF", "SIM", "PT"]
# E501: the formatter owns line length; RUF001-003: maths symbols in strings/comments are intended.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
xfail_strict = true
markers = [
    "realdata: needs local Tier A data; skipped when the data directory is absent",
    "slow: long-running test",
]
